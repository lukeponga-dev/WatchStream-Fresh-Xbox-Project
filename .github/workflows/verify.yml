name: Verify WatchStream

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Clean x64 build (Windows / UWP)
    # Modern .NET UWP XAML builds require the Visual Studio 2026 UWP toolchain.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Show toolchain and locate UWP-capable MSBuild
        shell: pwsh
        run: |
          dotnet --info
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found; a Visual Studio 2026 runner is required."
          }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.ComponentGroup.UWP.NetCoreAndStandard -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild) -or -not (Test-Path $msbuild)) {
            throw "UWP-capable MSBuild was not found. Install Visual Studio 2026 with Universal Windows Platform tools."
          }
          Write-Host "Using UWP-capable MSBuild: $msbuild"
          "WATCHSTREAM_MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $msbuild -version

      - name: Clean
        shell: pwsh
        run: |
          & "$env:WATCHSTREAM_MSBUILD" WatchStream.slnx /t:Clean /p:Configuration=Debug /p:Platform=x64

      - name: Restore and build
        shell: pwsh
        run: |
          & "$env:WATCHSTREAM_MSBUILD" WatchStream.slnx /restore /t:Build /p:Configuration=Debug /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:GenerateAppInstallerFile=false /p:PublishAot=false /m:1

  stremio-public-contracts:
    name: Validate live public Stremio add-on responses
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Cinemeta manifest and catalog responses
        shell: pwsh
        run: ./scripts/Verify-StremioPublicApi.ps1
